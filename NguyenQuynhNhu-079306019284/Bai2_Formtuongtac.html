<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 2 - Form tương tác</title><style>
body{font-family:Arial;background:#f3f5f9;margin:0;padding:25px}.container{max-width:650px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px #0001}
h1{text-align:center;color:#263b63}label{display:block;margin:14px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px}
button{margin-top:18px;padding:11px 20px;background:#263b63;color:white;border:0;border-radius:6px;cursor:pointer}
#extra{display:none;background:#f1f5fc;padding:12px;margin-top:12px;border-radius:8px}.result{margin-top:18px;color:#176b38}
</style></head><body><div class="container">
<h1>Form đăng ký hoạt động</h1>
<form id="myForm">
<label>Họ và tên</label><input id="name" required placeholder="Nhập họ tên">
<label>Email</label><input id="email" type="email" required placeholder="example@gmail.com">
<label>Bạn muốn tham gia hoạt động nào?</label>
<select id="activity" required><option value="">-- Chọn hoạt động --</option><option value="workshop">Workshop lập trình</option><option value="volunteer">Tình nguyện</option><option value="other">Khác</option></select>
<div id="extra"><label>Mô tả hoạt động khác</label><input id="otherActivity" placeholder="Nhập hoạt động bạn muốn"></div>
<label><input type="checkbox" id="agree" style="width:auto"> Tôi xác nhận thông tin trên là đúng</label>
<button type="submit">Gửi đăng ký</button>
</form><div class="result" id="result"></div></div>
<script>
const activity=document.getElementById("activity"),extra=document.getElementById("extra");
activity.addEventListener("change",()=>{extra.style.display=activity.value==="other"?"block":"none"});
document.getElementById("myForm").addEventListener("submit",e=>{
 e.preventDefault();
 if(!document.getElementById("agree").checked){alert("Bạn cần xác nhận thông tin.");return;}
 if(activity.value==="other"&&!document.getElementById("otherActivity").value.trim()){alert("Vui lòng mô tả hoạt động khác.");return;}
 const chosen=activity.value==="other"?document.getElementById("otherActivity").value:activity.options[activity.selectedIndex].text;
 document.getElementById("result").textContent=`Đăng ký thành công! Xin chào ${document.getElementById("name").value}, hoạt động: ${chosen}.`;
});
</script></body></html>
