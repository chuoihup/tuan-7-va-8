<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 5 - Form xử lý dữ liệu</title><style>
body{font-family:Arial;background:#f3f5f9;padding:25px}.wrap{max-width:700px;margin:auto;background:white;padding:25px;border-radius:12px}
label{display:block;margin:13px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px}
button{margin-top:16px;padding:10px 18px;background:#263b63;color:white;border:0;border-radius:6px}
#output{display:none;margin-top:20px;padding:15px;background:#edf7ef;border-radius:8px}
</style></head><body><div class="wrap"><h1>Form khảo sát thông tin sinh viên</h1>
<form id="survey">
<label>Họ và tên</label><input id="fullname" required>
<label>Mã sinh viên</label><input id="studentId" required>
<label>Lớp</label><input id="className" required>
<label>Giới tính</label><select id="gender"><option value="">Chọn giới tính</option><option>Nam</option><option>Nữ</option><option>Khác</option></select>
<label>Ý kiến</label><textarea id="comment" rows="3" placeholder="Nhập ý kiến của bạn"></textarea>
<button type="submit">Xử lý dữ liệu</button><button type="reset" style="background:#777">Làm mới</button>
</form><div id="output"></div></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function(){
 $("#survey").on("submit",function(e){
  e.preventDefault();
  const data={name:$("#fullname").val().trim(),id:$("#studentId").val().trim(),className:$("#className").val().trim(),gender:$("#gender").val(),comment:$("#comment").val().trim()};
  if(!data.name||!data.id||!data.className||!data.gender){alert("Vui lòng điền đầy đủ các trường bắt buộc.");return;}
  $("#output").html("<h3>Dữ liệu đã nhận</h3><p><b>Họ tên:</b> "+$("<div>").text(data.name).html()+"</p><p><b>MSSV:</b> "+$("<div>").text(data.id).html()+"</p><p><b>Lớp:</b> "+$("<div>").text(data.className).html()+"</p><p><b>Giới tính:</b> "+data.gender+"</p><p><b>Ý kiến:</b> "+$("<div>").text(data.comment||"Không có").html()+"</p>").show();
 });
 $("#survey").on("reset",function(){$("#output").hide().empty();});
});
</script></body></html>
